    <script>
      // 首帧防闪烁：CSS 绘制前按主题偏好挂 light 类（与 src/lib/theme.ts 同一判定）。
      // 缺这个，亮色偏好用户每次加载都会先闪一帧暗色。
      try {
        var p = localStorage.getItem("theme");
        var dark =
          p === "dark" ||
          ((p === null || p === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        if (!dark) document.documentElement.classList.add("light");
      } catch (e) {}
    </script>
