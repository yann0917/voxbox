name: desktop-release

# 双入口：①推 tag desktop-v* 直接触发；②Actions 页手动触发，填版本号由 resolve job 打 tag。
# 桌面发布强依赖 tag 语义（updater 版本比较 / Release 名 / latest.json 全取自 tag）。
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 x.y.z（可带 v 前缀）——将创建并推送 tag desktop-v<版本>"
        required: true
        type: string

permissions:
  contents: write

# 同一时间只允许一个桌面发布流程，避免并发打 tag
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  resolve:
    name: 解析版本与打 tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      commit: ${{ steps.ver.outputs.commit }}
    steps:
      - name: 检出代码（含全部 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析 tag（手动触发时在此创建并推送）
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
            version="${tag#desktop-v}"
            commit="$(git rev-parse "$tag^{commit}")"
            echo "tag 推送触发：$tag（$commit）"
          else
            version="${INPUT_VERSION#v}"   # 允许填 v0.2.0
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::版本号格式非法：'$version'，应为 x.y.z（例如 0.2.0）"
              exit 1
            fi
            tag="desktop-v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::tag $tag 已存在——同一桌面版本不可重复发布（updater latest.json 指向它会混淆已装用户），请换版本号"
              exit 1
            fi
            commit="$(git rev-parse HEAD)"
            git tag "$tag" "$commit"
            git push origin "$tag"
            echo "已创建并推送 tag：$tag（$commit）"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon：runner 原生 arm64，Go/Rust 按宿主 triple 出包
          - os: macos-latest
            triple: aarch64-apple-darwin
            ext: ""
            goarch: arm64
            rust_target: ""
            tauri_args: "--bundles dmg"
          # Intel：macos-13 runner 已退役（2025-12 下线），改 arm runner 双交叉编译：
          # sidecar GOARCH=amd64 + Rust --target x86_64（先 rustup target add）
          - os: macos-latest
            triple: x86_64-apple-darwin
            ext: ""
            goarch: amd64
            rust_target: x86_64-apple-darwin
            tauri_args: "--bundles dmg --target x86_64-apple-darwin"
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            ext: ".exe"
            goarch: amd64
            rust_target: ""
            tauri_args: "--bundles nsis"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码（固定到 tag 对应提交）
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 前端产物 + skill 进 embed 目录（等价 make web skills，Windows runner 无 make）
      - name: Build web assets
        run: |
          cd web && npm ci && npm run build && cd ..
          rm -rf cmd/voxbox/webdist && mkdir -p cmd/voxbox/webdist
          cp -r web/dist/* cmd/voxbox/webdist/
          rm -rf cmd/voxbox/skillsdist && mkdir -p cmd/voxbox/skillsdist
          cp -r skills/voxbox cmd/voxbox/skillsdist/

      # GOARCH 显式化：Intel 腿在 arm runner 上交叉编译，宿主架构不再与 triple 巧合一致
      - name: Build Go sidecar
        env:
          GOARCH: ${{ matrix.goarch }}
          DESKTOP_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          go build -ldflags "-s -w -X main.version=$DESKTOP_VERSION" \
            -o "desktop/src-tauri/binaries/voxbox-${{ matrix.triple }}${{ matrix.ext }}" ./cmd/voxbox
          # 交叉出的 x86_64 slice 在 arm host 上一样可签（Mach-O 任意架构均支持 ad-hoc）
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            codesign --force --sign - "desktop/src-tauri/binaries/voxbox-${{ matrix.triple }}"
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target（交叉编译腿）
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      # 内嵌 FFmpeg：mac 腿走抓取脚本（osxexperts 静态构建，哈希钉死在脚本内，
      # 含 ad-hoc 签名）；Windows 腿的 BtbN zip 由下方 PowerShell 步骤处理。
      - name: Fetch embedded FFmpeg（macOS）
        if: runner.os != 'Windows'
        run: bash desktop/fetch-ffmpeg.sh ${{ matrix.triple }}

      - name: Fetch embedded FFmpeg（Windows：BtbN zip 哈希校验 + 提取）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # BtbN/FFmpeg-Builds 固定 release autobuild-2026-09-27-13-04 的官方 checksums.sha256
          FF_ZIP_URL: "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-27-13-04/ffmpeg-n8.1.3-2-g45e8e0a3ff-win64-gpl-8.1.zip"
          FF_ZIP_SHA256: "16c5956a513ec236ed8b5786920662ab5a4a94e4ec553a8aebcf161439ef5416"
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "desktop/src-tauri/binaries"
          New-Item -ItemType Directory -Force $bin | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-win64.zip"
          Invoke-WebRequest -Uri $env:FF_ZIP_URL -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $env:FF_ZIP_SHA256) {
            throw "FFmpeg zip 哈希不符：BtbN 资产可能已变更，需重钉 desktop-release.yml 的 URL/SHA256"
          }
          $tmp = Join-Path $env:RUNNER_TEMP "ffmpeg-extract"
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          foreach ($name in @("ffmpeg", "ffprobe")) {
            $src = Get-ChildItem $tmp -Recurse -Filter "$name.exe" | Select-Object -First 1
            if (-not $src) { throw "zip 内未找到 $name.exe" }
            Copy-Item $src.FullName "$bin/$name-${{ matrix.triple }}.exe" -Force
            Write-Host "已放置 $name-${{ matrix.triple }}.exe"
          }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # bundle 版本对齐 tag，updater 版本比较依赖它
      - name: Sync version
        env:
          DESKTOP_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          node -e "const fs=require('fs');const p='desktop/src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')" "$DESKTOP_VERSION"

      # tauri-action 的 args 经 stringArgv 按空白切分（输入恒为字符串），矩阵直接带完整串
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.tauri_args }}
          tagName: ${{ needs.resolve.outputs.tag }}
          releaseName: "VoxBox ${{ needs.resolve.outputs.tag }}"
          releaseBody: "桌面版安装包与自动更新清单。macOS 首次打开：右键 → 打开；Windows：SmartScreen 点「仍要运行」。"
          releaseDraft: false
          prerelease: false

      # I2：latest.json 只在本次 tag release 上，updater endpoint 指向固定的 desktop-latest
      # 指针 release——否则 latest 与 CLI 发布通道互踩（latest 被别的 release 抢走就 404/错版本）。
      - name: Sync desktop-latest 更新指针
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release download "$DESKTOP_TAG" --pattern "latest.json" --output latest.json --clobber
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --title "VoxBox desktop 更新通道" --notes "自动维护的 latest.json 指针，随 desktop-v* 发布刷新，勿手动编辑"
          gh release upload desktop-latest latest.json --clobber
